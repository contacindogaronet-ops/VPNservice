name: Neural VPN APK Compiler

on:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Memuat Kode Sumber
      uses: actions/checkout@v4

    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🔨 Kompilasi APK (Auto-Versioning & Static Signature)
      env:
        CI_RUN_NUMBER: ${{ github.run_number }}
      run: |
        cd android
        gradle assembleDebug

    - name: 📦 Distribusi Artefak (APK)
      uses: actions/upload-artifact@v4
      with:
        name: Neural-VPN-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
