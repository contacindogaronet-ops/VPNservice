name: Neural VPN APK Compiler

on:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Memuat Kode Sumber
      uses: actions/checkout@v4

    - name: ⚙️ Setup Golang 1.22
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: ☕ Setup Java 17 (Syarat Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🛠️ Inisialisasi GoMobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init

    - name: 🧬 Kompilasi Golang ke Android Archive (.aar)
      run: |
        mkdir -p android/app/libs
        gomobile bind -target=android -androidapi 21 -o android/app/libs/core.aar ./core

    - name: 🔨 Kompilasi APK dengan Gradle Bawaan Ubuntu
      run: |
        cd android
        gradle assembleDebug

    - name: 📦 Distribusi Artefak (APK)
      uses: actions/upload-artifact@v4
      with:
        name: Neural-VPN-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
