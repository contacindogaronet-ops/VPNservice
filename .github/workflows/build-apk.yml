name: Neural VPN APK Compiler

on:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Memuat Kode Sumber
      uses: actions/checkout@v4

    - name: 🔍 Sensor Ukuran Biner
      run: |
        echo "Memeriksa fisik aset di server Cloud..."
        ls -lh android/app/src/main/assets/
        if [ ! -s android/app/src/main/assets/core_engine ]; then
          echo "🔥 FATAL: Biner core_engine adalah GHOST FILE (0 Byte)!"
          exit 1
        fi
        echo "✅ Biner bukan entitas kosong."

    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🔨 Kompilasi APK
      run: |
        cd android
        gradle assembleDebug

    - name: ☢️ X-Ray Anatomi APK (PEMBUKTIAN MUTLAK)
      run: |
        echo "Membongkar paksa isi APK yang baru dirakit..."
        unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep assets/ || echo "🔥 FATAL: Kompilator Gradle MEMBUANG biner Anda!"

    - name: 📦 Distribusi Artefak (APK)
      uses: actions/upload-artifact@v4
      with:
        name: Neural-VPN-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
