name: Build Neural VPN APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install GoMobile & Toolchain
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize GoMobile
        run: |
          gomobile init

      - name: Compile Go Monolithic Kernel (AAR)
        run: |
          mkdir -p android/app/libs
          gomobile bind -v -target=android -androidapi 26 -o android/app/libs/core.aar ./core

      - name: Setup Gradle CLI (Tanpa Wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-disabled: false

      - name: Build Android APK Direct with Gradle
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuralVPN-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
