name: Build Neural VPN APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install GoMobile & Toolchain
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize GoMobile
        run: |
          gomobile init

      - name: Compile Go Monolithic Kernel (AAR)
        run: |
          mkdir -p android/app/libs
          gomobile bind -v -target=android -androidapi 26 -o android/app/libs/core.aar ./core

      - name: Setup Persistent Signing Keystore
        working-directory: android/app
        run: |
          # Keystore PKCS12 permanen dengan validitas 10000 hari
          keytool -genkeypair -v \
            -keystore neuralvpn.keystore \
            -storepass neuralvpn123 \
            -alias neuralvpn \
            -keypass neuralvpn123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NeuralVPN, OU=Kernel, O=Jargo, L=Jakarta, ST=Jakarta, C=ID"

      - name: Setup Gradle Properties
        working-directory: android
        run: |
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Setup Gradle CLI
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-disabled: false

      - name: Build Signed Android APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuralVPN-Signed-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
